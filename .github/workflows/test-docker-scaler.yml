name: Test Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello_world:
    runs-on: ubuntu-latest
    container: node:18

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Hello
        shell: bash
        run: echo "HI"
